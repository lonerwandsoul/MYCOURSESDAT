; ============================================================================
;  OpenServer Panel 6 — конфигурация проекта «СМП Фаворит Диван»
;  Файл должен лежать по пути  OSPanel\home\semiglazov\.osp\project.ini
;
;  Благодаря этому файлу панель видит проект в списке и создаёт локальный домен.
;  Движки (HTTP/PHP) здесь НЕ указаны специально: они наследуются из общих
;  настроек OSP. Так проект не пропадёт из списка, даже если у вас установлены
;  другие версии модулей (PHP-8.4, PHP-8.4-FCGI, Nginx, Apache …).
;
;  Если нужно жёстко закрепить движки — раскомментируйте строки и укажите
;  точные имена модулей, которые видны в меню OSP → «Модули»
;  (список с именами также показывает команда  osp modules):
;
;      http_engine = Apache
;      php_engine  = PHP-8.4
;
;  Внимание: если указать несуществующий модуль, OSP проигнорирует домен.
; ============================================================================

[semiglazov.local]
; http_engine = Apache
; php_engine  = PHP-8.4

[semiglazov]
; Короткий адрес без .local — на случай, если удобнее открывать http://semiglazov/
; http_engine = Apache
; php_engine  = PHP-8.4
